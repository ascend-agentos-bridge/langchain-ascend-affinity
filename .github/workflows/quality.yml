name: Quality Gate

on: [push, pull_request]

jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # benchmark dependencies (deepagents) require Python >=3.11
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint pytest pytest-asyncio pytest-cov pytest-mock \
            "langchain-core>=1.0" "langchain>=1.0" langchain-openai deepagents
      - name: Run quality gate (pylint 10.00 + pytest coverage >= 90%)
        run: python scripts/quality_gate.py
