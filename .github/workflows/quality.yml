name: Quality Gate

on: [push, pull_request]

jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The library supports Python 3.9+; benchmark deps (deepagents)
        # require >=3.11 and are installed only there.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint pytest pytest-asyncio pytest-cov pytest-mock \
            "langchain-core>=1.0" "langchain>=1.0" langchain-openai
      - name: Install benchmark dependencies (Python >= 3.11)
        if: ${{ !startsWith(matrix.python-version, '3.9') && !startsWith(matrix.python-version, '3.10') }}
        run: pip install deepagents
      - name: Run quality gate (pylint 10.00 + pytest coverage >= 90%)
        run: python scripts/quality_gate.py
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: .coverage
