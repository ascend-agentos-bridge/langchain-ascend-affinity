[tool.poetry]
name = "langchain-ascend-affinity"
version = "0.1.0"
description = "Non-intrusive Ascend compute-affinity plugin for LangChain: proactive KV-Cache offload, prefetch and eviction via Agent Hint to cut TTFT in multi-agent scenarios."
authors = ["tianxiaoliang <tianxiaoliang@users.noreply.github.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/tianxiaoliang/langchain-ascend-affinity"
keywords = ["langchain", "ascend", "npu", "kv-cache", "agent-hint", "ttft", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
packages = [{ include = "langchain_ascend" }]

[tool.poetry.dependencies]
python = ">=3.9,<4.0"
langchain-core = ">=0.3.0,<2.0.0"
pydantic = ">=2.0.0,<3.0.0"

[tool.poetry.extras]
torch_npu = ["torch", "torch-npu"]
mindspore = ["mindspore"]
cann = ["pyacl", "acllite"]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-asyncio = ">=0.23"
pytest-cov = ">=5.0"
pytest-mock = ">=3.14"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests/unit_tests"]
asyncio_mode = "auto"
pythonpath = ["."]
addopts = "--cov=langchain_ascend --cov-report=term-missing --cov-fail-under=90"
markers = ["integration: requires real Ascend NPU hardware or an engine endpoint (skipped in CI)"]

[tool.pylint]
max-line-length = 100
disable = [
    "broad-exception-caught",     # hardware init degrades to hint-only mode
    "duplicate-code",             # backend adapters share hint passthrough logic
    "import-outside-toplevel",    # optional hardware deps imported lazily
    "missing-class-docstring",    # pytest test classes need no docstrings
    "missing-function-docstring", # LangChain callback hooks / test helpers
    "protected-access",           # tests intentionally probe internals
    "redefined-outer-name",       # pytest fixtures reuse module-level names
    "too-few-public-methods",     # marker test classes
    "too-many-arguments",         # LangChain callback signatures are fixed
    "unused-argument",            # callback overrides must match signatures
]