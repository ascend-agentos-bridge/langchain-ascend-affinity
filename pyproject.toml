[tool.poetry]
name = "langchain-ascend-affinity"
version = "0.2.0"
description = "Non-intrusive Ascend compute-affinity for LangChain: cache_salt session binding + prefix-diff scheduling + partial KV-Cache release to cut TTFT and cost on Ascend engines."
authors = ["tianxiaoliang <tianxiaoliang@users.noreply.github.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/ascend-agentos-bridge/langchain-ascend-affinity"
keywords = ["langchain", "ascend", "npu", "kv-cache", "ttft", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
packages = [{ include = "langchain_ascend" }]

[tool.poetry.urls]
"Source" = "https://github.com/ascend-agentos-bridge/langchain-ascend-affinity"
"Changelog" = "https://github.com/ascend-agentos-bridge/langchain-ascend-affinity/blob/main/CHANGELOG.md"
"Issues" = "https://github.com/ascend-agentos-bridge/langchain-ascend-affinity/issues"

[tool.poetry.dependencies]
python = ">=3.9,<4.0"
langchain-core = ">=1.0.0,<2.0.0"
pydantic = ">=2.0.0,<3.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-asyncio = ">=0.23"
pytest-cov = ">=5.0"
pytest-mock = ">=3.14"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests/unit_tests"]
asyncio_mode = "auto"
pythonpath = ["."]
addopts = "--cov=langchain_ascend --cov=benchmark.metrics --cov=benchmark.tasks --cov-report=term-missing --cov-fail-under=90"
markers = ["integration: requires real Ascend NPU hardware or an engine endpoint (skipped in CI)"]

[tool.pylint]
max-line-length = 100
disable = [
    "broad-exception-caught",     # hardware init degrades to hint-only mode
    "duplicate-code",             # backend adapters share hint passthrough logic
    "import-outside-toplevel",    # optional hardware deps imported lazily
    "missing-class-docstring",    # pytest test classes need no docstrings
    "missing-function-docstring", # LangChain callback hooks / test helpers
    "protected-access",           # tests intentionally probe internals
    "redefined-outer-name",       # pytest fixtures reuse module-level names
    "too-few-public-methods",     # marker test classes
    "too-many-arguments",         # LangChain callback signatures are fixed
    "unused-argument",            # callback overrides must match signatures
]